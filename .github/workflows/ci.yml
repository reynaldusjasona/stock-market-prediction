name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder"
      JWT_SECRET: "ci-test-secret-key-not-for-production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          pip install flake8
          cd backend
          flake8 . --max-line-length=100 --exclude=__pycache__,.venv,venv

      - name: Run admin test suite (mocked)
        run: |
          cd backend
          pytest tests/admin -v

      - name: Run investor test suite (mocked)
        run: |
          cd backend
          pytest tests/investor -v

      - name: Run trader test suite (mocked)
        run: |
          cd backend
          pytest tests/trader -v